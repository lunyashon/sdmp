server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name cdp-dmp.ru www.cdp-dmp.ru;

	if ($host = www.cdp-dmp.ru) {
		return 301 https://cdp-dmp.ru$request_uri;
	}

	ssl_certificate /etc/letsencrypt/live/cdp-dmp.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/cdp-dmp.ru/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	root /var/www/sdmp;
	index index.html;
	client_max_body_size 2m;

	access_log /var/log/nginx/cdp-dmp.ru.access.log;
	error_log /var/log/nginx/cdp-dmp.ru.error.log;

	location /rest/ {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 120s;
		proxy_send_timeout 120s;
		proxy_connect_timeout 5s;
	}

	location ^~ /swagger/ {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 120s;
		proxy_send_timeout 120s;
		proxy_connect_timeout 5s;
	}

	location /api/ {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 120s;
		proxy_send_timeout 120s;
		proxy_connect_timeout 5s;
	}

	location = / {
		return 302 /list/;
	}

	location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
		expires 30d;
		add_header Cache-Control "public, immutable";
		access_log off;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name cdp-dmp.ru www.cdp-dmp.ru;
	return 301 https://cdp-dmp.ru$request_uri;
}
