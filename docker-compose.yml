services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: sdmp-api
    container_name: sdmp-api
    env_file:
      - config/.env
    environment:
      TZ: Europe/Moscow
    network_mode: host
    volumes:
      - ./config/.env:/app/config/.env
      - ./logs:/app/logs
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: sdmp-worker
    container_name: sdmp-worker
    env_file:
      - config/.env
    environment:
      TZ: Europe/Moscow
    network_mode: host
    extra_hosts:
      - "bfl-activity.ru:46.254.20.220"
      - "crm-zennit.ru:95.163.86.21"
    volumes:
      - ./config/.env:/app/config/.env
      - ./logs:/app/logs
    restart: unless-stopped