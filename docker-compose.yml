services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: sdmp-api
    container_name: sdmp-api
    env_file:
      - config/.env
    network_mode: host
    volumes:
      - ./config/.env:/app/config/.env
      - ./logs:/app/logs
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: sdmp-worker
    container_name: sdmp-worker
    env_file:
      - config/.env
    network_mode: host
    volumes:
      - ./config/.env:/app/config/.env
      - ./logs:/app/logs
    restart: unless-stopped