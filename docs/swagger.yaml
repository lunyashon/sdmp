info:
  contact: {}
  description: 'REST и приём трафика SDMP. Успешные ответы: {success:true, data:...}.'
  title: SDMP API
  version: "0.1"
paths:
  /api/v1/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/response.HealthBody'
              type: object
      summary: Health
      tags:
      - health
  /rest/leads:
    get:
      parameters:
      - description: Дата с, dd.mm.yyyy HH:MM:SS
        in: query
        name: date_from
        required: true
        type: string
      - description: Дата по
        in: query
        name: date_to
        required: true
        type: string
      - collectionFormat: multi
        description: ID источников
        in: query
        items:
          type: integer
        name: sources
        type: array
      - collectionFormat: multi
        description: ID подисточников
        in: query
        items:
          type: integer
        name: child_sources
        type: array
      - collectionFormat: multi
        description: Метка базы
        in: query
        items:
          type: string
        name: cold_label
        type: array
      - collectionFormat: multi
        description: ID регионов
        in: query
        items:
          type: integer
        name: region
        type: array
      - collectionFormat: multi
        description: ID операторов
        in: query
        items:
          type: integer
        name: operator
        type: array
      - collectionFormat: multi
        description: ID стадий
        in: query
        items:
          type: integer
        name: status
        type: array
      - collectionFormat: multi
        description: Заря
        in: query
        items:
          type: string
        name: zarya
        type: array
      - description: Телефон
        in: query
        name: phone
        type: string
      - description: Город
        in: query
        name: city
        type: string
      - description: Тег
        in: query
        name: tag
        type: string
      - description: ID результата звонка
        in: query
        name: call_result
        type: integer
      - description: false=создалась из СК, true=обновилась
        in: query
        name: via_us
        type: boolean
      - default: 10
        description: Лимит
        in: query
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.LeadsResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Список лидов
      tags:
      - leads
  /rest/leads/{id}:
    get:
      parameters:
      - description: lead_row.id или uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.LeadDetailResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Карточка лида
      tags:
      - leads
  /rest/leads/{id}/partners/{partnerId}/resend:
    post:
      parameters:
      - description: lead_row.id или uuid
        in: path
        name: id
        required: true
        type: integer
      - description: ID партнёра
        in: path
        name: partnerId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.PartnerResendResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Повторная отправка партнёру
      tags:
      - leads
  /rest/leads/{id}/raw:
    get:
      parameters:
      - description: lead_row.id или uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Сырой payload лида (S3)
      tags:
      - leads
  /rest/leads/enrichment-stats:
    get:
      parameters:
      - description: Дата с
        in: query
        name: date_from
        required: true
        type: string
      - description: Дата по
        in: query
        name: date_to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.LeadEnrichmentStatList'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Статистика обогащения (регион / оператор)
      tags:
      - leads
  /rest/leads/export.xlsx:
    get:
      parameters:
      - description: Дата с
        in: query
        name: date_from
        required: true
        type: string
      - description: Дата по
        in: query
        name: date_to
        required: true
        type: string
      - collectionFormat: multi
        description: ID источников
        in: query
        items:
          type: integer
        name: sources
        type: array
      - collectionFormat: multi
        description: ID подисточников
        in: query
        items:
          type: integer
        name: child_sources
        type: array
      - collectionFormat: multi
        description: Метка базы
        in: query
        items:
          type: string
        name: cold_label
        type: array
      - collectionFormat: multi
        description: ID регионов
        in: query
        items:
          type: integer
        name: region
        type: array
      - collectionFormat: multi
        description: ID операторов
        in: query
        items:
          type: integer
        name: operator
        type: array
      - collectionFormat: multi
        description: ID стадий
        in: query
        items:
          type: integer
        name: status
        type: array
      - collectionFormat: multi
        description: Заря
        in: query
        items:
          type: string
        name: zarya
        type: array
      - description: Телефон
        in: query
        name: phone
        type: string
      - description: Город
        in: query
        name: city
        type: string
      - description: Тег
        in: query
        name: tag
        type: string
      - description: ID результата звонка
        in: query
        name: call_result
        type: integer
      - description: false=создалась из СК, true=обновилась
        in: query
        name: via_us
        type: boolean
      - collectionFormat: multi
        description: Только эти lead_row.id
        in: query
        items:
          type: integer
        name: ids
        type: array
      - collectionFormat: multi
        description: Колонки файла
        in: query
        items:
          type: string
        name: columns
        type: array
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Выгрузка лидов в XLSX
      tags:
      - leads
  /rest/leads/incoming-stats:
    get:
      parameters:
      - description: Дата с
        in: query
        name: date_from
        required: true
        type: string
      - description: Дата по
        in: query
        name: date_to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.SuccessEnvelope'
            - properties:
                data:
                  $ref: '#/definitions/dto.LeadSourceCountList'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Входящий трафик по источникам
