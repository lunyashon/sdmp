<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вход — DMP</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f5f5f3; --surface: #ffffff; --border: #dcdad3; --border-strong: #c4c1b8;
    --text: #1a1a18; --text-2: #6b6862; --accent: #2f5233; --danger: #a23b2e; --radius: 6px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  form {
    width: 360px; max-width: calc(100vw - 32px);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 28px 24px 24px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 18px; }
  label { display: block; font-size: 12px; color: var(--text-2); font-weight: 500; margin: 0 0 4px; }
  input {
    width: 100%; height: 32px; margin-bottom: 12px;
    border: 1px solid var(--border-strong); border-radius: var(--radius);
    padding: 0 8px; font-size: 13px; background: var(--surface); color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .err { min-height: 18px; color: var(--danger); font-size: 13px; margin-bottom: 8px; }
  button {
    height: 32px; padding: 0 14px; border-radius: var(--radius);
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
    font-size: 13px; font-weight: 500; cursor: pointer;
  }
  button:hover { background: #274529; }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
<form id="login-form">
  <h1>Вход</h1>
  <label for="login">Логин</label>
  <input id="login" name="login" autocomplete="username" required>
  <label for="password">Пароль</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <div class="err" id="err"></div>
  <button type="submit" id="submit">Войти</button>
</form>
<script>
(function () {
  var KEY = 'sdmp_token';
  function nextPath() {
    var next = new URLSearchParams(location.search).get('next') || '/list/';
    if (next.charAt(0) !== '/' || next.indexOf('//') === 0 || next.indexOf('/login') === 0) return '/list/';
    return next;
  }
  try {
    if (localStorage.getItem(KEY)) location.replace(nextPath());
  } catch (e) {}
  var form = document.getElementById('login-form');
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = document.getElementById('submit');
    var err = document.getElementById('err');
    err.textContent = '';
    btn.disabled = true;
    fetch('/rest/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        login: form.login.value.trim(),
        password: form.password.value
      })
    }).then(function (res) {
      return res.json().then(function (body) { return { ok: res.ok, body: body }; });
    }).then(function (out) {
      var tok = out.body && out.body.data && out.body.data.token;
      if (!out.ok || !tok) {
        err.textContent = 'Неверный логин или пароль';
        btn.disabled = false;
        return;
      }
      localStorage.setItem(KEY, tok);
      location.replace(nextPath());
    }).catch(function () {
      err.textContent = 'Не удалось войти';
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
